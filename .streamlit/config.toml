[server]
headless = true
# CORS/XSRF off so the app also works behind a tunnel host (Cloudflare/ngrok).
# Streamlit Cloud sets address/port itself.
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#F26522"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#1A1A1A"
font = "sans serif"

